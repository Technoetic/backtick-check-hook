name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BACKTICK_TIMING_SCALE: "3"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        codepage: [949, 65001]
    steps:
      # actions/checkout v7.0.1 (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0 (Node 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Report shell and interpreter versions
        shell: pwsh
        run: |
          python --version
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          pwsh -NoProfile -Version
          & "$env:ProgramFiles/Git/bin/bash.exe" --version
      - name: Run the isolated suite
        run: python -X utf8 -B tools/test_windows.py ${{ matrix.codepage }}
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: UTC
    steps:
      # actions/checkout v7.0.1 (Node 24)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check repeatability
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          for copy in first second; do
            git -c core.autocrlf=false archive --format=zip --prefix=backtick-check-hook/ --output="$RUNNER_TEMP/$copy.zip" HEAD
          done
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/second.zip"
          sha256sum "$RUNNER_TEMP/first.zip"
